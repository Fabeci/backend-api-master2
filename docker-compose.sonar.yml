# SonarQube Community — analyse statique locale de SOMAPRO
# Usage :
#   docker compose -f docker-compose.sonar.yml up -d
#   (attendre http://localhost:9000/api/system/status = UP)
#   puis lancer le scanner (voir doc/tests/06-analyse-statique.md)
services:
  sonarqube:
    image: sonarqube:community
    container_name: somapro-sonarqube
    ports:
      - "9000:9000"
    environment:
      # Docker Desktop / WSL : évite les contrôles de bootstrap Elasticsearch
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc:
        soft: 4096
        hard: 4096
    restart: unless-stopped

volumes:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
