# ============================================================================
# SOMAPRO — Nginx (frontend + API)
# Adapter les `server_name` si le domaine change.
# ============================================================================
upstream somapro_backend { server backend:8000; }

# ── Site (Angular) ─────────────────────────────────────────────────────────
server {
    listen 80;
    server_name somapro.gconnectapp.com;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 200m;

    location / {
        try_files $uri $uri/ /index.html;
    }
    location /media/ {
        alias /app/media/;
        expires 7d;
    }
}

# ── API (Django / ASGI) ────────────────────────────────────────────────────
server {
    listen 80;
    server_name somaproapi.gconnectapp.com;

    client_max_body_size 200m;

    location /static/ {
        alias /app/staticfiles/;
        expires 7d;
    }
    location /media/ {
        alias /app/media/;
    }

    # WebSockets (notifications)
    location /ws/ {
        proxy_pass http://somapro_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://somapro_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }
}
