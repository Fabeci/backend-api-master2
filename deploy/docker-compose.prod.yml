# ============================================================================
# SOMAPRO — production (LWS VPS, Docker)
# Lancement : docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod up -d --build
# ============================================================================
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    build:
      context: ..
    env_file: .env.prod
    environment:
      DB_ENGINE: postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      DEBUG: "False"
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 master_backend_api.asgi:application"
    volumes:
      - media:/app/media
      - staticfiles:/app/staticfiles
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  celery:
    build:
      context: ..
    env_file: .env.prod
    environment:
      DB_ENGINE: postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      DEBUG: "False"
    command: celery -A master_backend_api worker -l info
    volumes:
      - media:/app/media
    depends_on:
      - backend
      - redis
    restart: unless-stopped

  celery-beat:
    build:
      context: ..
    env_file: .env.prod
    environment:
      DB_ENGINE: postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      DEBUG: "False"
    command: celery -A master_backend_api beat -l info
    depends_on:
      - backend
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ../../master-frontend
      dockerfile: Dockerfile.prod
    volumes:
      - ./nginx/somapro.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/app/media:ro
      - staticfiles:/app/staticfiles:ro
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  media:
  staticfiles:
