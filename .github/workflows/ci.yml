name: CI backend

on:
  push:
    branches: [main, feat/ui-lmd]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.docker.txt
      - name: Django check
        env:
          DJANGO_SECRET_KEY: ci-secret-key-not-for-prod
          DEBUG: 'True'
          DB_ENGINE: sqlite
          ALLOWED_HOSTS: 'localhost,testserver,127.0.0.1'
        run: python manage.py check
      - name: Installer coverage
        run: pip install coverage

      - name: Tests complets (unitaires + intégration + sécurité + IA)
        env:
          DJANGO_SECRET_KEY: ci-secret-key-not-for-prod
          DEBUG: 'True'
          DB_ENGINE: sqlite
          ALLOWED_HOSTS: 'localhost,testserver,127.0.0.1'
        run: |
          coverage run --source=core,courses,evaluations,users,academics,analytics,progress,notifications,resources,collaborations,feedback,gamification,locations,parametres \
            manage.py test core courses evaluations users academics analytics progress notifications resources collaborations feedback gamification locations parametres -v2

      - name: Rapport de couverture
        run: |
          coverage report -m
          coverage html
          coverage xml -o coverage.xml

      - name: Publier la couverture (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: couverture-backend
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: ignore
