name: CI backend

on:
  push:
    branches: [main, feat/ui-lmd]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.docker.txt
      - name: Django check
        env:
          DJANGO_SECRET_KEY: ci-secret-key-not-for-prod
          DEBUG: 'True'
          DB_ENGINE: sqlite
          ALLOWED_HOSTS: 'localhost,testserver,127.0.0.1'
        run: python manage.py check
      - name: Tests (périmètres, publication, corrigés, LMD)
        env:
          DJANGO_SECRET_KEY: ci-secret-key-not-for-prod
          DEBUG: 'True'
          DB_ENGINE: sqlite
          ALLOWED_HOSTS: 'localhost,testserver,127.0.0.1'
        run: python manage.py test core.tests_security core.tests_rbac -v2
