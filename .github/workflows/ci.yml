name: CI backend

on:
  push:
    branches: [main, feat/ui-lmd]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.docker.txt
      - name: Django check
        env:
          DJANGO_SECRET_KEY: ci-secret-key-not-for-prod
          DEBUG: 'True'
          DB_ENGINE: sqlite
          ALLOWED_HOSTS: 'localhost,testserver,127.0.0.1'
        run: python manage.py check
      - name: Installer coverage
        run: pip install coverage

      - name: Tests complets (unitaires + intégration + sécurité + IA)
        env:
          DJANGO_SECRET_KEY: ci-secret-key-not-for-prod
          DEBUG: 'True'
          DB_ENGINE: sqlite
          ALLOWED_HOSTS: 'localhost,testserver,127.0.0.1'
        run: |
          coverage run --source=core,courses,evaluations,users,academics,analytics,progress,notifications,resources,collaborations,feedback,gamification,locations,parametres \
            manage.py test core courses evaluations users academics analytics progress notifications resources collaborations feedback gamification locations parametres -v2

      - name: Rapport de couverture
        run: |
          coverage report -m
          coverage html
          coverage xml -o coverage.xml

      - name: Publier la couverture (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: couverture-backend
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: ignore

      - name: Vérifier la configuration email
        id: mail
        if: success()
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          FROM="${MAIL_FROM:-$SMTP_USERNAME}"
          if [ -n "$SMTP_SERVER" ] && [ -n "$MAIL_TO" ] && [ -n "$FROM" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Notifications email non configurées (secrets SMTP_SERVER, MAIL_TO et MAIL_FROM/SMTP_USERNAME manquants)."
          fi

      - name: Notifier le succès par email
        id: notify
        if: success() && steps.mail.outputs.enabled == 'true'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT || 587 }}
          secure: ${{ secrets.SMTP_SECURE || 'false' }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "✅ SOMAPRO — CI backend réussie (${{ github.ref_name }})"
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_FROM || secrets.SMTP_USERNAME }}
          body: |
            La CI backend SOMAPRO est passée avec succès.

            Dépôt  : ${{ github.repository }}
            Branche : ${{ github.ref_name }}
            Commit  : ${{ github.sha }}
            Auteur  : ${{ github.actor }}
            Run     : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Tests backend : suite complète OK
            Couverture : artefact disponible dans le run.

      - name: Signaler un échec de notification
        if: steps.notify.outcome == 'failure'
        run: echo "::warning::La CI a réussi, mais l'email de notification n'a pas pu être envoyé. Vérifiez les secrets SMTP."
