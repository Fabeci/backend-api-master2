name: Deploy backend → cPanel (FTP)

# Déploie le code par FTP puis dépose un drapeau `deploy.flag`.
# Une tâche cron cPanel (5 min) exécute alors :
#   pip install → migrate → collectstatic → restart Passenger.
#
# Secrets requis (Settings → Secrets → Actions) :
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, FTP_SERVER_DIR (ex. /)
#   FTP_PORT (optionnel, 21 par défaut)
#
# ⚠️ `.env`, la base SQLite, les médias et les statiques sont EXCLUS.

on:
  push:
    branches: [main]
    paths:
      - '**/*.py'
      - 'requirements*.txt'
      - 'passenger_wsgi.py'
      - 'deploy/cpanel/**'
      - '.github/workflows/deploy-backend-ftp.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: Upload code + drapeau
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Upload FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ftp
          local-dir: ./
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/__pycache__/**
            **/*.pyc
            **/.venv/**
            **/venv/**
            db.sqlite3
            media/**
            static/**
            staticfiles/**
            institution_logos/**
            tmp/**
            .env
            feedback.zip
            .vscode/**
            .tmp-*/**

      - name: Déclencher le déploiement (drapeau)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > /tmp/deploy.flag
          curl -sS --fail --ftp-create-dirs \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            -T /tmp/deploy.flag "ftp://$FTP_SERVER${FTP_SERVER_DIR%/}/deploy.flag"
          echo "✅ Code envoyé, drapeau déposé."

      - name: Résumé
        run: |
          echo "### ✅ Backend envoyé" >> "$GITHUB_STEP_SUMMARY"
          echo "La tâche cron cPanel va appliquer les migrations et redémarrer Passenger." >> "$GITHUB_STEP_SUMMARY"

      - name: Vérifier la configuration email
        id: mail
        if: success()
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          FROM="${MAIL_FROM:-$SMTP_USERNAME}"
          if [ -n "$SMTP_SERVER" ] && [ -n "$MAIL_TO" ] && [ -n "$FROM" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Notifications email non configurées (secrets SMTP_SERVER, MAIL_TO et MAIL_FROM/SMTP_USERNAME manquants)."
          fi

      - name: Notifier le succès par email
        id: notify
        if: success() && steps.mail.outputs.enabled == 'true'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT || 587 }}
          secure: ${{ secrets.SMTP_SECURE || 'false' }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "✅ SOMAPRO — backend déployé sur cPanel"
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_FROM || secrets.SMTP_USERNAME }}
          body: |
            Le backend SOMAPRO a été envoyé avec succès sur cPanel.

            Dépôt  : ${{ github.repository }}
            Branche : ${{ github.ref_name }}
            Commit  : ${{ github.sha }}
            Auteur  : ${{ github.actor }}
            Run     : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Le drapeau deploy.flag a été déposé : la tâche cron cPanel va appliquer
            les migrations et redémarrer Passenger.

      - name: Signaler un échec de notification
        if: steps.notify.outcome == 'failure'
        run: echo "::warning::Le déploiement a réussi, mais l'email de notification n'a pas pu être envoyé. Vérifiez les secrets SMTP."
