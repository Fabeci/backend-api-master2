name: Deploy (LWS cPanel)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cpanel
  cancel-in-progress: false

jobs:
  # ── Frontend Angular : build + upload FTP ────────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Fabeci/master-frontend
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build -- --configuration production
      - name: Upload FTP vers cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:   ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/tagus/browser/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}

  # ── Backend Django : SSH + script de déploiement ─────────────────────────
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Déploiement SSH (cPanel)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USER }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_PORT || 22 }}
          script_stop: true
          script: |
            bash "$HOME/somapro/backend-api-master2/deploy/cpanel/deploy-backend.sh"
