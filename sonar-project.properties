# sonar-project.properties — analyse statique SOMAPRO (backend Django)
# Scanner : sonarsource/sonar-scanner-cli
sonar.projectKey=somapro-backend
sonar.projectName=SOMAPRO Backend
sonar.projectVersion=1.0

sonar.host.url=http://host.docker.internal:9000
sonar.sourceEncoding=UTF-8

# Sources Python (le dépôt est monté à la racine)
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/tests.py,**/tests_*.py

sonar.exclusions=\
  **/migrations/**,\
  **/__pycache__/**,\
  **/env/**,\
  **/venv/**,\
  **/.venv/**,\
  media/**,\
  static/**,\
  staticfiles/**,\
  institution_logos/**,\
  node_modules/**,\
  feedback.zip,\
  **/*.sqlite3,\
  **/*.pyc,\
  .git/**,\
  doc/**,\
  **/seed_*.py,\
  seed_*.py

# Couverture importée depuis coverage.py
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.version=3.12

# Duplication : ignorer les migrations générées
sonar.cpd.exclusions=**/migrations/**

# Pas de blocage du scanner sur la quality gate (récupérée ensuite via l'API)
sonar.qualitygate.wait=false
